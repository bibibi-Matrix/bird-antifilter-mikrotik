# === Antifilter Sources ===
antifilter_download=yes
antifilter_network=no

# antifilter.download lists
ip=no
ipresolve=no
ipsum=no
subnet=no
allyouneed=yes
community=no

# antifilter.network lists
nf_ip=yes
nf_ipsmart=yes
nf_ipsum=yes
nf_subnet=yes
nf_uablacklist=yes
nf_govno=yes
nf_ip6=yes

# === Blacklist ===
blacklist=yes

# === Overlap Resolution ===
overlap_check=yes
# specific = удалить supernet, оставить subnet
# log_only = только логировать
overlap_strategy=specific

# === BGP Settings ===
local_as=64500
gw_as=64501
hold_time=240

# === Monitoring ===
# Порог для алерта мониторинга: если маршрутов меньше - warning (0 = отключить)
min_routes=1000
